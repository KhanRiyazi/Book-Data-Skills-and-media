name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ["backend/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke check
        run: |
          test -s index.html
          grep -q 'id="v-skills"' index.html
          grep -q 'id="v-data"' index.html
          grep -q 'id="v-media"' index.html

      - name: Build site folder
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: |
          mkdir _site
          cp index.html config.js .nojekyll _site/
          if [ -n "$APPS_SCRIPT_URL" ]; then
            sed -i "s|__APPS_SCRIPT_URL__|$APPS_SCRIPT_URL|" _site/config.js
          else
            echo "APPS_SCRIPT_URL not set: the site will work without the backend."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
